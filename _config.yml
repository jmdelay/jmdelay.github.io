# Site Settings
title: "Changepoint Analytics LLC"
name: "Changepoint Analytics LLC"
description: "Decision infrastructure for SMB operators without an internal data function. I build Answers, Systems, and Engines from the data you already have—primarily for healthcare practices, clinics, and outpatient operators."
url: "https://changepointdata.com"
baseurl: ""
repository: "jmdelay/jmdelay.github.io"
logo: "/assets/images/logo.svg"

# Build settings
include: ["_pages"]
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

# Author
author:
  name: "John DeLay"
  avatar: "/assets/images/bio-photo.jpg"  # add your photo here
  bio: "Solo operator building decision systems—Answer, System, Engine—for SMBs without an internal data team. Background: production AI at health tech, SR 11-7 model validation at a regional bank, Medicare analytics, and peer-reviewed public health research."
  location: "Birmingham, AL"
  email: "john@changepointdata.com"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/john-delay-7741b7124"

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Exclude from builds
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - CLAUDE.md
  - plan.md
  - README.md
