# Site Settings
title: "John DeLay"
subtitle: "Data Scientist for Hire"
name: "John DeLay"
description: "Freelance data scientist helping small businesses unlock insights from their data — forecasting, dashboards, modeling, and more."
url: "https://jmdelay.github.io"
baseurl: ""
repository: "jmdelay/jmdelay.github.io"

# Build settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache

# Author
author:
  name: "John DeLay"
  avatar: "/assets/images/bio-photo.jpg"  # add your photo here
  bio: "Data scientist with experience in healthcare & financial services. I help small businesses make smarter decisions with their data."
  location: "Birmingham, AL"
  email: "macdelay@gmail.com"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:macdelay@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/johndelay-7741b7124"
    - label: "Portfolio"
      icon: "fas fa-fw fa-chart-bar"
      url: "https://jmdelay.github.io/Rfolio/"

# Navigation
navigation:
  - title: "About"
    url: /
  - title: "Services"
    url: /services/
  - title: "Portfolio"
    url: https://jmdelay.github.io/Rfolio/
  - title: "Contact"
    url: /contact/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Exclude from builds
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
