# Site Settings
title: "John DeLay"
subtitle: "Data Scientist for Hire"
name: "John DeLay"
description: "Freelance data science and research consulting for small businesses — forecasting, dashboards, modeling, and research support."
url: "https://jmdelay.github.io"
baseurl: ""
repository: "jmdelay/jmdelay.github.io"

# Build settings
include: ["_pages"]
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache

# Author
author:
  name: "John DeLay"
  avatar: "/assets/images/bio-photo.jpg"  # add your photo here
  bio: "Data scientist with experience in healthcare & financial services. I help small businesses make smarter decisions with their data."
  location: "Birmingham, AL"
  email: "macdelay+llc@gmail.com"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/john-delay-7741b7124"

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Exclude from builds
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
