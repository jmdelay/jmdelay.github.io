# Site Settings
title: "Changepoint Analytics LLC"
name: "Changepoint Analytics LLC"
description: "Fractional analytics operator for healthcare and regulated SMBs—staffing, pricing, and performance decisions from the data you already have."
url: "https://changepointdata.com"
baseurl: ""
repository: "jmdelay/jmdelay.github.io"
logo: "/assets/images/logo.svg"

# Build settings
include: ["_pages"]
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

# Author
author:
  name: "John DeLay"
  avatar: "/assets/images/bio-photo.jpg"  # add your photo here
  bio: "Fractional analytics operator for healthcare and regulated SMBs—staffing, pricing, and performance. Healthcare ops and margin systems."
  email: "john@changepointdata.com"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/john-delay-7741b7124"

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Exclude from builds
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - CLAUDE.md
  - plan.md
  - README.md
