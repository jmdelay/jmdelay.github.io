# Site Settings
title: "Changepoint Analytics"
name: "Changepoint Analytics"
description: "AI and data science consulting for healthcare and financial services teams."
url: "https://changepointdata.com"
baseurl: ""
repository: "jmdelay/jmdelay.github.io"
logo: "/assets/images/logo.svg"

# Build settings
include: ["_pages"]
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache

# Author
author:
  name: "John DeLay"
  avatar: "/assets/images/bio-photo.jpg"  # add your photo here
  bio: "AI and data science consultant specializing in healthcare and financial services. Production models at health tech, risk model validation at a major regional bank, Medicare analytics, and published public health research."
  location: "Birmingham, AL"
  email: "john@changepointdata.com"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/john-delay-7741b7124"

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Exclude from builds
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
