# Site Settings
title: "Changepoint Analytics LLC"
name: "Changepoint Analytics LLC"
description: "Find operational waste and recover margin for healthcare and regulated SMBs—operations intelligence for staffing, pricing, and performance."
url: "https://changepointdata.com"
baseurl: ""
repository: "jmdelay/jmdelay.github.io"
logo: "/assets/images/logo.svg"

# Build settings
include: ["_pages"]
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

# Author
author:
  name: "John DeLay"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Operations intelligence partner — find operational waste, recover margin. Healthcare and regulated SMBs."
  location: "Birmingham, AL"
  email: "john@changepointdata.com"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/john-delay-7741b7124"

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      categories: Data

# Exclude from builds
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - CLAUDE.md
  - plan.md
  - README.md
