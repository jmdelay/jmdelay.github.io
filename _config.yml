# Site Settings
title: "Changepoint Analytics LLC"
name: "Changepoint Analytics LLC"
description: "Find the profit leaks hiding in your operations. Fractional Analytics Operator helping SMB operators reduce waste, protect margin, and act faster using the data they already have—primarily healthcare practices, clinics, and outpatient operators."
url: "https://changepointdata.com"
baseurl: ""
repository: "jmdelay/jmdelay.github.io"
logo: "/assets/images/logo.svg"

# Build settings
include: ["_pages"]
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap

# Author
author:
  name: "John DeLay"
  avatar: "/assets/images/bio-photo.jpg"  # add your photo here
  bio: "Fractional Analytics Operator. I help SMB operators find trapped profit, reduce waste, and protect margin—Answer, System, Engine—without hiring a data team. Background: Medicare quality analytics, SR 11-7 model validation at a regional bank, production clinical decision-support workflows at health tech, and peer-reviewed public health research."
  location: "Birmingham, AL"
  email: "john@changepointdata.com"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/john-delay-7741b7124"

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Exclude from builds
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - CLAUDE.md
  - plan.md
  - README.md
